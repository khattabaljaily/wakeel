{% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}{% if field.name == 'requires_ack' %}
<div class="form-check mb-3">{{ field }}<label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label></div>
{% else %}
<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}
  {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>
{% endif %}{% endfor %}
