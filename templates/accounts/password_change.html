{% extends "base.html" %}
{% block title %}تغيير كلمة المرور{% endblock %}
{% block page_title %}الحساب{% endblock %}
{% block content %}
<div class="wk-card" style="max-width: 520px"><div class="wk-card-body">
<form method="post" novalidate>{% csrf_token %}
    {% for field in form %}{% include "_field.html" %}{% endfor %}
    <button class="btn btn-primary">حفظ</button>
</form>
</div></div>
<div class="wk-card mt-4" style="max-width: 520px; border-color: #fecdca"><div class="wk-card-body d-flex align-items-center gap-3">
    <div class="flex-grow-1"><strong class="text-danger">حذف الحساب</strong><div class="small-muted">حذف حسابك والشركات التي تملكها نهائياً.</div></div>
    <a href="{% url 'accounts:delete' %}" class="btn btn-outline-danger btn-sm">حذف الحساب</a>
</div></div>
{% endblock %}
