{% load i18n static %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}" dir="{% if LANGUAGE_BIDI %}rtl{% else %}ltr{% endif %}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>{% block title %}Wakeel{% endblock %} · Wakeel</title>
<link rel="stylesheet" href="{% static 'fonts/fonts.css' %}">
<style>
  :root { --muted: #71717a; --line: #e4e4e7; --bad: #dc2626; --bad-soft: #fef2f2; --ok: #16a34a; --ok-soft: #f0fdf4; --accent: #6d5ef8; --accent-soft: #f1efff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f4f5; color: #18181b; font-family: "Cairo", system-ui, sans-serif; }
  .vp { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2rem; padding: 1.5rem 1rem 2rem; }
  .vp-card { width: 100%; max-width: 36rem; background: #fff; border: 1px solid var(--line); border-radius: 22px; padding: 1.6rem 1.4rem; box-shadow: 0 24px 50px -24px rgba(24,24,27,.35); }
  .vp-center { text-align: center; max-width: 28rem; }
  .vp-from { margin: 0; color: var(--muted); font-size: .88rem; }
  .fp-title { margin: .15rem 0 .6rem; font-size: 1.45rem; font-weight: 800; overflow-wrap: anywhere; }
  .fp-desc { margin: 0 0 1.2rem; color: #3f3f46; line-height: 1.8; overflow-wrap: anywhere; }
  .vp-note { margin: 1rem 0 0; color: var(--muted); font-size: .85rem; line-height: 1.7; text-align: center; }
  .vp-warn { margin: 0 0 1rem; padding: .7rem .9rem; border-radius: 12px; background: var(--bad-soft); color: var(--bad); font-weight: 700; font-size: .9rem; }
  .fp-q { border: 1px solid var(--line); border-radius: 14px; padding: .9rem 1rem 1rem; margin: 0 0 .9rem; min-width: 0; }
  .fp-q legend { font-weight: 700; padding: 0 .3rem; overflow-wrap: anywhere; }
  .fp-bad { border-color: var(--bad); background: var(--bad-soft); }
  .fp-req { color: var(--bad); }
  .fp-err { color: var(--bad); font-size: .85rem; margin-top: .4rem; font-weight: 700; }
  .fp-q input[type=text], .fp-q input[type=date], .fp-q textarea { width: 100%; padding: .6rem .8rem; border: 1px solid var(--line); border-radius: 12px; font: inherit; background: #fff; }
  .fp-q input:focus, .fp-q textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .fp-opt { display: flex; align-items: center; gap: .55rem; padding: .45rem .2rem; cursor: pointer; }
  .fp-opt input { accent-color: var(--accent); width: 1.05rem; height: 1.05rem; }
  .fp-rate { display: flex; gap: .45rem; flex-wrap: wrap; }
  .fp-rate label { cursor: pointer; position: relative; }
  .fp-rate input { position: absolute; opacity: 0; inset: 0; margin: 0; }
  .fp-rate span { display: inline-flex; width: 2.6rem; height: 2.6rem; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 12px; font-weight: 700; }
  .fp-rate input:checked + span { background: var(--accent); color: #fff; border-color: var(--accent); }
  .fp-rate input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .fp-hp { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }   /* hidden without an offset: in RTL a far offset widens the page */
  .btn { background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: .7rem 1.6rem; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn-light { background: var(--accent-soft); color: var(--accent); }
  .fp-send { width: 100%; }
  .vp-status h1 { font-size: 1.3rem; margin: .6rem 0 .5rem; }
  .vp-icon { display: inline-flex; width: 3.2rem; height: 3.2rem; border-radius: 50%; align-items: center; justify-content: center; background: var(--ok-soft); color: var(--ok); }
  .vp-icon svg { width: 1.7rem; height: 1.7rem; }
  .vp-center h1 { font-size: 1.3rem; margin: .6rem 0 .5rem; }
  .vp-by { display: flex; align-items: center; gap: .45rem; margin: 0; color: var(--muted); font-size: .8rem; }
</style></head><body>
<main class="vp">{% block body %}{% endblock %}
<p class="vp-by"><img src="{% static 'img/logo.svg' %}" alt="" width="20" height="20"><span>Wakeel</span></p></main>
</body></html>
