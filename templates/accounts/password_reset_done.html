{% extends "accounts/base_auth.html" %}
{% block title %}تحقق من بريدك{% endblock %}
{% block auth_content %}
<div class="wk-auth__head text-center">
    <span class="wk-auth__icon mx-auto"><i class="bi bi-envelope-check"></i></span>
    <h1>تحقق من بريدك الإلكتروني</h1>
    <p>إذا كان هذا البريد مسجلاً لدينا، فستصلك خلال دقائق رسالة فيها رابط لتعيين كلمة مرور جديدة. الرابط صالح ليوم واحد.</p>
</div>
<a href="{% url 'accounts:login' %}" class="btn btn-light w-100 wk-auth__submit">العودة لتسجيل الدخول</a>
{% endblock %}
