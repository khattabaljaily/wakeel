{# The actions menu for one subscription `c` (with `edit` JSON). #}
<div class="dropdown">
    <button class="btn btn-sm btn-light" data-bs-toggle="dropdown" aria-label="إجراءات {{ c.name }}"><i class="bi bi-three-dots"></i>{% if label %} {{ label }}{% endif %}</button>
    <div class="dropdown-menu dropdown-menu-end">
        {% if not detail %}<a class="dropdown-item" href="{% url 'ops:company' c.pk %}"><i class="bi bi-eye"></i> عرض التفاصيل</a>{% endif %}
        {% if not c.is_approved %}<button type="button" class="dropdown-item text-success" data-sub-action="approve" data-id="{{ c.pk }}" data-name="{{ c.name }}"><i class="bi bi-patch-check"></i> اعتماد</button>{% endif %}
        <button type="button" class="dropdown-item" data-sub-action="edit" data-id="{{ c.pk }}" data-name="{{ c.name }}" data-edit="{{ edit }}"><i class="bi bi-pencil-square"></i> تعديل</button>
        <button type="button" class="dropdown-item" data-sub-action="renew" data-id="{{ c.pk }}" data-name="{{ c.name }}" data-plan="{{ c.subscription_plan }}"><i class="bi bi-arrow-clockwise"></i> تجديد</button>
        <form method="post" action="{% url 'ops:subscription_toggle' c.pk %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">
            {% if c.is_active %}
            <button class="dropdown-item text-warning" data-confirm-title="تعليق «{{ c.name }}»؟" data-confirm="لن يتمكن فريق الشركة من العمل، ويتوقف النشر التلقائي ورابط العميل حتى تعيد تنشيطه. البيانات تبقى كما هي." data-confirm-ok="تعليق"><i class="bi bi-pause-circle"></i> تعليق</button>
            {% else %}
            <button class="dropdown-item text-success"><i class="bi bi-play-circle"></i> تنشيط</button>
            {% endif %}
        </form>
        <div class="dropdown-divider"></div>
        <form method="post" action="{% url 'ops:subscription_delete' c.pk %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><input type="hidden" name="confirm_name">
            <button class="dropdown-item text-danger" data-confirm-title="حذف «{{ c.name }}» نهائياً؟" data-confirm="ستُحذف الشركة وخططها ومنشوراتها وصورها وكل بياناتها، ولا يمكن التراجع عن ذلك. حسابات أعضائها تبقى." data-confirm-ok="حذف نهائي" data-confirm-require="{{ c.name }}" data-confirm-field="confirm_name"><i class="bi bi-trash"></i> حذف</button>
        </form>
    </div>
</div>
