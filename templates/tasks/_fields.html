{% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
<div class="row">
  {% for field in form %}{% if field.name != 'description' %}
  <div class="col-md-6 mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}
    {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>
  {% endif %}{% endfor %}
</div>
<div class="mb-3"><label class="form-label" for="{{ form.description.id_for_label }}">{{ form.description.label }}</label>{{ form.description }}
  {% for e in form.description.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>
