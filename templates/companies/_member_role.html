{% load i18n %}{% if membership.can_manage and m.role != 'owner' %}
<form method="post" action="{% url 'companies:member_update' m.pk %}">{% csrf_token %}
    <select name="role" class="form-select form-select-sm" style="max-width: 190px" onchange="this.form.submit()" aria-label="{% blocktranslate trimmed with display_name=m.user.display_name %}دور {{ display_name }}{% endblocktranslate %}">
        {% for value, label in roles %}{% if value != 'owner' %}<option value="{{ value }}" {% if value == m.role %}selected{% endif %}>{{ label }}</option>{% endif %}{% endfor %}
    </select>
</form>
{% else %}<span class="adm-pill adm-pill--info">{{ m.get_role_display }}</span>{% endif %}
