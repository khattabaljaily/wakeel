    {% if membership.can_manage %}<button type="button" class="btn btn-sm btn-primary" data-bulk-action="approve" disabled><i class="bi bi-patch-check"></i> {% translate "اعتماد" %} <span class="n"></span></button>{% endif %}

</div>
{% endif %}
