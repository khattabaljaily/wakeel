{% load i18n %}<div class="row g-2 align-items-end mb-2" data-row>
    <div class="col-md-3"><label class="form-label small">{% translate "Language" %}</label>
        <select name="other_lang" class="form-select form-select-sm">{% for code, name in LANGUAGES %}<option value="{{ code }}"{% if row.lang == code %} selected{% endif %}>{{ name }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label small">{% translate "Company name" %}</label>
        <input type="text" name="other_name" value="{{ row.name|default:'' }}" maxlength="200" dir="auto" class="form-control form-control-sm"></div>
    <div class="col-md-4"><label class="form-label small">{% translate "Address" %}</label>
        <textarea name="other_address" rows="1" dir="auto" class="form-control form-control-sm">{{ row.address|default:'' }}</textarea></div>
    <div class="col-md-1 text-end"><button type="button" class="btn btn-sm btn-light" data-remove-row aria-label="{% translate 'Remove' %}"><i class="bi bi-x-lg"></i></button></div>
</div>
